<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unfold</title>
<meta name="description" content="Books. One idea at a time.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#DCD7CB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unfold">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  /* ============================================================
     UNFOLD — bone, core, oxide. One grotesque, one monospace.
     Nothing is rounded. Nothing decorates. The block meter is
     the book: one block per idea, filled as you read it.
     ============================================================ */
  :root {
    --paper:  #DCD7CB;   /* bone */
    --raised: #EDEAE2;   /* salt */
    --ink:    #0E0D0B;   /* core */
    --mid:    #6E695C;   /* concrete */
    --line:   #BFB8A7;
    --oxide:  #8C3F1D;   /* the only accent. saved things only. */
    --paper-rgb: 220, 215, 203;

    --sans: "Helvetica Neue", Helvetica, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --pad: 1.25rem;
    --snap: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #0E0D0B;
      --raised: #1A1917;
      --ink:    #DCD7CB;
      --mid:    #857F71;
      --line:   #2C2A24;
      --oxide:  #C2542A;
      --paper-rgb: 14, 13, 11;
    }
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.055rem;
    line-height: 1.72;
    font-weight: 400;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--oxide); outline-offset: 2px; }

  /* ---------- type roles ---------- */
  .mono {
    font-family: var(--mono); font-size: 0.645rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--mid); font-weight: 500;
  }
  .display {
    font-weight: 700; text-transform: uppercase; letter-spacing: -0.035em;
    line-height: 0.96; text-wrap: balance;
  }

  .screen { display: none; padding: 0 var(--pad) calc(9.5rem + env(safe-area-inset-bottom)); }
  .screen.active { display: block; }

  /* ================= LIBRARY ================= */
  .masthead { display: flex; align-items: flex-start; justify-content: space-between; padding: 1.5rem 0 0.35rem; gap: 1rem; }
  .wordmark { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.05em; line-height: 1; text-transform: uppercase; }
  .saved-btn { padding: 0.35rem 0 0.35rem 0.75rem; min-height: 44px; display: flex; align-items: flex-start; }
  .saved-btn .mono { color: var(--ink); }
  .saved-btn .dot { display: inline-block; width: 0.45rem; height: 0.45rem; background: var(--oxide); margin-right: 0.4rem; vertical-align: 0.02rem; }
  .sub { padding-bottom: 1.6rem; }

  .book-row {
    display: block; width: 100%; text-align: left;
    padding: 1.35rem 0 1.45rem; border-top: 1px solid var(--line);
  }
  .book-row:last-of-type { border-bottom: 1px solid var(--line); }
  .book-row .spec { display: block; margin-bottom: 0.8rem; }
  .book-row .name { display: block; font-size: clamp(1.6rem, 7.4vw, 2rem); margin-bottom: 0.4rem; }
  .book-row .by { display: block; margin-bottom: 1rem; }
  .book-row .stat { display: block; margin-top: 0.75rem; }
  .book-row .stat b { color: var(--ink); font-weight: 500; }

  .colophon { padding: 2.4rem 0 0; }

  /* ---------- THE BLOCK METER ---------- */
  .meter { display: flex; gap: 2px; width: 100%; align-items: stretch; }
  .meter.tall { gap: 3px; }
  .blk {
    flex: 1 1 0; min-width: 0; height: 13px; border: 1px solid var(--line);
    background: transparent; padding: 0; transition: background 0.2s var(--snap), border-color 0.2s var(--snap);
  }
  .meter.tall .blk { height: 22px; }
  .blk.read  { background: var(--ink); border-color: var(--ink); }
  .blk.saved { background: var(--oxide); border-color: var(--oxide); }
  .blk.here  { border-color: var(--oxide); border-width: 2px; }
  .meter.tall .blk.here { background: var(--oxide); border-color: var(--oxide); }

  /* ================= READER ================= */
  .reader-top { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.9rem; }
  .reader-top button { padding: 0.5rem 0; min-height: 44px; display: flex; align-items: center; }
  .reader-rail { padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
  .reader-rail .bookname { display: block; margin-bottom: 0.6rem; }

  .concept { padding-top: 1.7rem; }
  .concept.out { opacity: 0; transition: opacity 0.12s linear; }
  .concept.in  { animation: rise 0.26s var(--snap) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
  .concept-title { font-size: clamp(2.15rem, 10.2vw, 3.05rem); margin-bottom: 1.5rem; }
  .hook { font-size: 1.2rem; line-height: 1.45; font-weight: 400; letter-spacing: -0.012em; max-width: 34ch; }

  .layer { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.38s var(--snap), opacity 0.22s linear; }
  .layer.open { grid-template-rows: 1fr; opacity: 1; }
  .layer-in { min-height: 0; overflow: hidden; }
  .layer-head { display: flex; align-items: center; gap: 0.75rem; margin: 2.3rem 0 1.5rem; }
  .layer-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .layer-in p { margin-bottom: 1.15rem; }
  .layer-in p:last-of-type { margin-bottom: 0; }
  .srcline { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }

  /* ================= BOTTOM DOCK ================= */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
    display: none; background: var(--paper); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .dock.active { display: block; }
  .dock-row { display: flex; align-items: stretch; justify-content: space-between; height: 46px; }
  .dock-row > * { display: flex; align-items: center; }
  .dock-btn { padding: 0 var(--pad); }
  .dock-btn:disabled { opacity: 0.32; }
  .dock-stat { padding: 0 var(--pad); }
  .dock-stat b { color: var(--ink); font-weight: 500; }
  .tag {
    padding: 0 var(--pad); border-left: 1px solid var(--line);
    transition: background 0.14s linear, color 0.14s linear;
  }
  .tag.on { background: var(--oxide); }
  .tag.on .mono { color: var(--raised); }

  .slab {
    display: block; width: 100%; height: 62px; background: var(--ink); color: var(--paper);
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    font-weight: 500; transition: opacity 0.12s linear;
  }
  .slab:active { opacity: 0.78; }
  .slab.ghost { background: transparent; color: var(--ink); border-top: 1px solid var(--line); }

  /* ================= PANEL (contents / saved) ================= */
  .panel {
    position: fixed; inset: 0; z-index: 20; background: var(--raised);
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.28s var(--snap);
    visibility: hidden;
  }
  .panel.open { transform: translateY(0); visibility: visible; }
  .panel-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem var(--pad); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .panel-title { font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: -0.035em; }
  .panel-top button { padding: 0.5rem 0 0.5rem 1rem; min-height: 44px; }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--pad) calc(2rem + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .sect { padding: 1.6rem 0 0.7rem; }
  .toc {
    display: flex; align-items: baseline; gap: 0.85rem; width: 100%; text-align: left;
    padding: 0.85rem 0; border-top: 1px solid var(--line); min-height: 46px;
  }
  .toc .num { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em; color: var(--mid); width: 1.6rem; flex-shrink: 0; }
  .toc .t { flex: 1; font-size: 1.02rem; line-height: 1.32; }
  .toc.done .t { color: var(--mid); }
  .toc.mark .num { color: var(--oxide); }
  .toc .from { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blank { padding: 3rem 0; color: var(--mid); }

  /* ================= COMPLETE ================= */
  .complete {
    position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--paper);
    display: none; flex-direction: column; justify-content: space-between;
    padding: calc(2.5rem + env(safe-area-inset-top)) var(--pad) calc(2.5rem + env(safe-area-inset-bottom));
  }
  .complete.active { display: flex; }
  .complete .mono { color: var(--paper); opacity: 0.55; }
  .complete-mid { display: flex; flex-direction: column; justify-content: center; flex: 1; }
  .complete-word { font-size: clamp(3.2rem, 17vw, 5.2rem); font-weight: 700; text-transform: uppercase; letter-spacing: -0.05em; line-height: 0.88; }
  .complete-book { margin-top: 1.6rem; font-size: 1.15rem; line-height: 1.3; max-width: 22ch; }
  .complete .meter { margin-top: 2rem; }
  .complete .blk { background: var(--paper); border-color: var(--paper); height: 10px; }
  .complete-mid > * { animation: rise 0.5s var(--snap) both; }
  .complete-mid > :nth-child(2) { animation-delay: 0.09s; }
  .complete-mid > :nth-child(3) { animation-delay: 0.18s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ================= LIBRARY ================= -->
<main id="library" class="screen active">
  <div class="masthead">
    <h1 class="wordmark">Unfold</h1>
    <button class="saved-btn" onclick="openPanel('saved')"><span class="mono"><span class="dot"></span><span id="saved-count">Saved</span></span></button>
  </div>
  <p class="mono sub">Books · one idea at a time</p>
  <div id="book-list"></div>
  <p class="mono colophon">To add a book, read the readme</p>
</main>

<!-- ================= READER ================= -->
<main id="reader" class="screen">
  <div class="reader-top">
    <button class="mono" onclick="history.back()">← Library</button>
    <button class="mono" onclick="openPanel('contents')">Contents</button>
  </div>
  <div class="reader-rail">
    <span class="mono bookname" id="reader-book"></span>
    <div class="meter" id="reader-meter"></div>
  </div>
  <article class="concept" id="concept"></article>
</main>

<!-- ================= DOCK ================= -->
<nav class="dock" id="dock">
  <div class="dock-row" id="dock-row"></div>
  <button class="slab" id="slab" onclick="advance()"></button>
</nav>

<!-- ================= PANEL ================= -->
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel-top">
    <h2 class="panel-title" id="panel-title"></h2>
    <button class="mono" onclick="history.back()">Close</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</section>

<!-- ================= COMPLETE ================= -->
<div class="complete" id="complete" onclick="closeComplete()">
  <span class="mono" id="complete-top"></span>
  <div class="complete-mid">
    <div class="complete-word">Complete</div>
    <div class="complete-book display" id="complete-book"></div>
    <div class="meter" id="complete-meter"></div>
  </div>
  <span class="mono">Tap to return</span>
</div>

<script src="books/manifest.js"></script>
<script>
/* ================= STATE ================= */
window.__BOOKS = [];
window.registerBook = function (book) { window.__BOOKS.push(book); };

const STORE_KEY = "unfold-state-v1";
let S = { read: {}, saved: {}, pos: {}, flags: {} };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
S.flags = S.flags || {};
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let current = { book: null, index: 0, layer: 1 };
let panelOpen = false, readerOn = false;

/* ================= LOADING ================= */
function loadBooks() {
  const files = window.BOOK_FILES || [];
  let remaining = files.length;
  if (!remaining) { renderLibrary(); return; }
  const order = files.map(f => f.replace(/\.js$/, ""));
  files.forEach(f => {
    const s = document.createElement("script");
    s.src = "books/" + f;
    s.onload = s.onerror = () => {
      if (--remaining === 0) {
        /* scripts resolve in network order — restore manifest order (filename = id, per README) */
        window.__BOOKS.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        renderLibrary();
      }
    };
    document.body.appendChild(s);
  });
}

/* ================= HELPERS ================= */
function bookById(id) { return window.__BOOKS.find(b => b.id === id); }
function readSet(b) { return S.read[b.id] || (S.read[b.id] = {}); }
function savedSet(b) { return S.saved[b.id] || (S.saved[b.id] = {}); }
function readCount(b) { return b.concepts.filter(c => readSet(b)[c.id]).length; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function paras(t) { return t.split(/\n\n+/).map(p => "<p>" + esc(p) + "</p>").join(""); }
function pad2(n) { return n < 10 ? "0" + n : String(n); }
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }

/* One block per idea. Filled = read. Oxide = saved. Ringed = where you are. */
function meterHTML(b, opts) {
  const o = opts || {};
  return b.concepts.map((c, i) => {
    const cls = ["blk"];
    if (savedSet(b)[c.id]) cls.push("saved");
    else if (readSet(b)[c.id]) cls.push("read");
    if (o.here === i) cls.push("here");
    return o.jump
      ? `<button class="${cls.join(" ")}" onclick="jumpTo(${i})" aria-label="Idea ${i + 1}: ${esc(c.title)}"></button>`
      : `<span class="${cls.join(" ")}"></span>`;
  }).join("");
}

/* ================= LIBRARY ================= */
function renderLibrary() {
  const list = document.getElementById("book-list");
  if (!window.__BOOKS.length) {
    list.innerHTML = '<p class="blank">No books loaded. Add one to books/manifest.js — the readme explains it.</p>';
    return;
  }
  list.innerHTML = window.__BOOKS.map(b => {
    const done = readCount(b), total = b.concepts.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const mode = b.mode === "sequential" ? "Sequence" : "Shuffle";
    const stat = done === total
      ? "Complete"
      : `<b>${pad2(done)}</b> of ${pad2(total)} read · ${pct}%`;
    return `
      <button class="book-row" onclick="openBook('${b.id}')">
        <span class="mono spec">${mode} · ${total} ideas</span>
        <span class="name display">${esc(b.title)}</span>
        <span class="mono by">${esc(b.author)}</span>
        <span class="meter">${meterHTML(b, {})}</span>
        <span class="mono stat">${stat}</span>
      </button>`;
  }).join("");
  const totalSaved = window.__BOOKS.reduce((n, b) => n + Object.keys(S.saved[b.id] || {}).length, 0);
  document.getElementById("saved-count").textContent = totalSaved ? "Saved · " + totalSaved : "Saved";
}

/* ================= READER ================= */
function openBook(id) {
  const b = bookById(id);
  if (!b) return;
  current.book = b;
  current.index = b.mode === "sequential"
    ? Math.min(S.pos[b.id] || 0, b.concepts.length - 1)
    : pickShuffle(b, true);
  history.pushState({ v: "reader" }, "");
  enterReader();
}

function enterReader() {
  readerOn = true;
  document.getElementById("library").classList.remove("active");
  document.getElementById("reader").classList.add("active");
  document.getElementById("dock").classList.add("active");
  current.layer = 1;
  render();
  window.scrollTo(0, 0);
}

function exitReader() {
  readerOn = false;
  document.getElementById("reader").classList.remove("active");
  document.getElementById("dock").classList.remove("active");
  document.getElementById("library").classList.add("active");
  renderLibrary();
  window.scrollTo(0, 0);
}

function pickShuffle(b, first) {
  const unread = b.concepts.map((c, i) => readSet(b)[c.id] ? -1 : i).filter(i => i >= 0);
  const pool = unread.length ? unread : b.concepts.map((_, i) => i);
  let pick = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && !first) {
    while (pick === current.index) pick = pool[Math.floor(Math.random() * pool.length)];
  }
  return pick;
}

function render() {
  const b = current.book, c = b.concepts[current.index];
  document.getElementById("reader-book").textContent = b.title;
  document.getElementById("reader-meter").innerHTML = meterHTML(b, { here: current.index, jump: true });

  const el = document.getElementById("concept");
  el.className = "concept in";
  el.innerHTML = `
    <div class="eyebrow">
      <span class="mono">${esc(c.section || b.title)}</span>
      <span class="mono">${pad2(current.index + 1)} / ${pad2(b.concepts.length)}</span>
    </div>
    <h2 class="concept-title display">${esc(c.title)}</h2>
    <p class="hook">${esc(c.hook)}</p>

    <div class="layer" id="layer-idea"><div class="layer-in">
      <div class="layer-head"><span class="mono">The idea</span></div>
      ${paras(c.idea)}
    </div></div>

    <div class="layer" id="layer-deep"><div class="layer-in">
      <div class="layer-head"><span class="mono">Deeper</span></div>
      ${paras(c.deep)}
      <div class="srcline"><span class="mono">Source</span><span class="mono">${esc(c.source || b.title)}</span></div>
    </div></div>`;
  renderDock();
}

function renderDock() {
  const b = current.book;
  if (!b) return;
  const row = document.getElementById("dock-row");
  const saved = !!savedSet(b)[b.concepts[current.index].id];
  const seq = b.mode === "sequential";
  const done = readCount(b), total = b.concepts.length;

  row.innerHTML = `
    ${seq ? `<button class="mono dock-btn" id="prev" onclick="step(-1)">← Prev</button>`
          : `<span class="mono dock-stat"><b>${pad2(done)}</b> / ${pad2(total)} read</span>`}
    <button class="tag${saved ? " on" : ""}" id="tag" onclick="toggleSave()" aria-pressed="${saved}">
      <span class="mono">${saved ? "Saved" : "Save"}</span>
    </button>`;
  if (seq) document.getElementById("prev").disabled = current.index === 0;

  const slab = document.getElementById("slab");
  slab.classList.remove("ghost");
  if (current.layer === 1) slab.textContent = "The idea";
  else if (current.layer === 2) slab.textContent = "Deeper";
  else if (seq) {
    const last = current.index === total - 1;
    slab.textContent = last ? "Back to library" : "Next idea";
    if (last) slab.classList.add("ghost");
  } else slab.textContent = "Shuffle";
}

/* the slab is the whole interaction: idea → deeper → next */
function advance() {
  if (current.layer === 1) {
    document.getElementById("layer-idea").classList.add("open");
    current.layer = 2;
    markRead();
    renderDock();
  } else if (current.layer === 2) {
    document.getElementById("layer-deep").classList.add("open");
    current.layer = 3;
    renderDock();
  } else {
    if (current.book.mode === "sequential") {
      if (current.index === current.book.concepts.length - 1) history.back();
      else step(1);
    } else shuffle();
  }
}

function markRead() {
  const b = current.book, c = b.concepts[current.index];
  if (readSet(b)[c.id]) return;
  readSet(b)[c.id] = true; save();
  document.getElementById("reader-meter").innerHTML = meterHTML(b, { here: current.index, jump: true });
  if (readCount(b) === b.concepts.length && !S.flags["done-" + b.id]) {
    S.flags["done-" + b.id] = true; save();
    setTimeout(() => showComplete(b), 700);
  }
}

function swap(fn) {
  const el = document.getElementById("concept");
  el.className = "concept out";
  setTimeout(() => { fn(); render(); window.scrollTo(0, 0); }, 120);
}

function step(dir) {
  const b = current.book, next = current.index + dir;
  if (next < 0 || next >= b.concepts.length) return;
  swap(() => { current.index = next; S.pos[b.id] = next; save(); current.layer = 1; });
}

function shuffle() {
  swap(() => { current.index = pickShuffle(current.book, false); current.layer = 1; });
}

function toggleSave() {
  const b = current.book, c = b.concepts[current.index];
  if (savedSet(b)[c.id]) delete savedSet(b)[c.id];
  else { savedSet(b)[c.id] = true; buzz(9); }
  save();
  renderDock();
  document.getElementById("reader-meter").innerHTML = meterHTML(b, { here: current.index, jump: true });
}

/* ================= SWIPE ================= */
(function () {
  const zone = document.getElementById("reader");
  let x0 = 0, y0 = 0;
  zone.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  zone.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (!readerOn || panelOpen || Math.abs(dx) < 64 || Math.abs(dy) > 48) return;
    if (current.book.mode === "sequential") step(dx < 0 ? 1 : -1);
    else shuffle();
  }, { passive: true });
})();

/* ================= PANEL ================= */
function openPanel(kind) {
  buildPanel(kind);
  history.pushState({ v: "panel" }, "");
  panelOpen = true;
  document.getElementById("panel").classList.add("open");
}
function hidePanel() {
  if (!panelOpen) return;
  panelOpen = false;
  document.getElementById("panel").classList.remove("open");
}

function buildPanel(kind) {
  const body = document.getElementById("panel-body");
  document.getElementById("panel-title").textContent = kind === "contents" ? "Contents" : "Saved";

  if (kind === "contents") {
    const b = current.book;
    /* group by section so a book whose sections interleave still reads cleanly */
    const groups = [];
    b.concepts.forEach((c, i) => {
      const key = c.section || "";
      let g = groups.find(g => g.key === key);
      if (!g) groups.push(g = { key, items: [] });
      g.items.push({ c, i });
    });
    body.innerHTML = groups.map(g => `
      ${g.key ? `<div class="mono sect">${esc(g.key)}</div>` : ""}
      ${g.items.map(({ c, i }) => {
        const isRead = !!readSet(b)[c.id], isSaved = !!savedSet(b)[c.id];
        return `<button class="toc${isRead ? " done" : ""}${isSaved ? " mark" : ""}" onclick="jumpTo(${i})">
          <span class="num">${isSaved ? "◆" : isRead ? "■" : pad2(i + 1)}</span>
          <span class="t">${esc(c.title)}</span>
        </button>`;
      }).join("")}`).join("");
  } else {
    let html = "";
    window.__BOOKS.forEach(b => {
      b.concepts.forEach((c, i) => {
        if (!savedSet(b)[c.id]) return;
        html += `<button class="toc mark" onclick="openSaved('${b.id}',${i})">
          <span class="num">◆</span>
          <span class="t">${esc(c.title)}</span>
          <span class="from">${esc(b.title)}</span>
        </button>`;
      });
    });
    body.innerHTML = html || '<p class="blank">Nothing saved yet. Tag an idea in the reader and it lands here.</p>';
  }
  body.scrollTop = 0;
}

function jumpTo(i) {
  if (!current.book) return;
  const wasPanel = panelOpen;
  current.index = i;
  if (current.book.mode === "sequential") { S.pos[current.book.id] = i; save(); }
  current.layer = 1;
  render();
  window.scrollTo(0, 0);
  if (wasPanel) history.back();
}

function openSaved(bookId, i) {
  current.book = bookById(bookId);
  current.index = i;
  current.layer = 1;
  hidePanel();
  history.replaceState({ v: "reader" }, "");
  enterReader();
}

/* ================= COMPLETE ================= */
function showComplete(b) {
  document.getElementById("complete-top").textContent = b.mode === "sequential" ? "Sequence finished" : "Every idea unfolded";
  document.getElementById("complete-book").textContent = b.title;
  document.getElementById("complete-meter").innerHTML = meterHTML(b, {});
  const el = document.getElementById("complete");
  el.classList.remove("active"); void el.offsetWidth; el.classList.add("active");
  buzz([10, 55, 10]);
}
function closeComplete() { document.getElementById("complete").classList.remove("active"); }

/* ================= HISTORY / KEYS ================= */
window.addEventListener("popstate", () => {
  if (panelOpen) { hidePanel(); return; }
  if (readerOn) exitReader();
});

document.addEventListener("keydown", e => {
  if (!readerOn || panelOpen) return;
  if (e.key === "ArrowRight") { current.book.mode === "sequential" ? step(1) : shuffle(); }
  else if (e.key === "ArrowLeft" && current.book.mode === "sequential") step(-1);
  else if ((e.key === "Enter" || e.key === " ") && document.activeElement === document.body) { e.preventDefault(); advance(); }
});

/* ================= BOOT ================= */
loadBooks();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
