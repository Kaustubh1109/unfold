<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unfold</title>
<meta name="description" content="Books, one idea at a time. Read in layers.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1E6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15130E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unfold">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --paper: #F5F1E6;
    --paper-rgb: 245, 241, 230;
    --paper-deep: #ECE6D4;
    --ink: #221E16;
    --ink-soft: #57503E;
    --ink-faint: #837A67;
    --hairline: #DFD8C4;
    --seal: #9E3B26;
    --col: 40rem;
    --ease: cubic-bezier(0.22, 0.61, 0.21, 1);
    --grain-opacity: 0.05;
    --grain-blend: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15130E;
      --paper-rgb: 21, 19, 14;
      --paper-deep: #1D1A13;
      --ink: #E8E2D2;
      --ink-soft: #A89F8B;
      --ink-faint: #7E7663;
      --hairline: #2A261D;
      --seal: #C65940;
      --grain-opacity: 0.04;
      --grain-blend: screen;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
    font-size: 1.07rem;
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  /* paper grain — the page is washi, not a screen */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="240" height="240" filter="url(%23n)" opacity="0.6"/></svg>');
    opacity: var(--grain-opacity); mix-blend-mode: var(--grain-blend);
  }
  .label {
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
    font-size: 0.66rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 3px; border-radius: 2px; }

  .screen { display: none; max-width: var(--col); margin: 0 auto; padding: 1.3rem 1.5rem calc(7rem + env(safe-area-inset-bottom)); }
  .screen.active { display: block; }
  .quiet-btn {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.71rem; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--ink-soft); padding: 0.6rem 0; min-height: 44px;
  }

  /* ---------- ensō ---------- */
  .enso-mini { display: block; }
  .enso-mini .track { fill: none; stroke: var(--hairline); stroke-width: 2.5; }
  .enso-mini .arc { fill: none; stroke: var(--ink); stroke-width: 6.5; stroke-linecap: round; transition: stroke-dasharray 0.8s var(--ease); }
  .enso-mini.sealed .arc { stroke: var(--seal); }

  /* ---------- Library ---------- */
  .masthead { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 0 0.3rem; }
  .brand { display: flex; align-items: center; gap: 0.65rem; }
  .enso-mark { width: 1.55rem; height: 1.55rem; }
  .enso-mark .stroke {
    fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 264; stroke-dashoffset: 24;
  }
  .booting .enso-mark .stroke { animation: draw 1.1s var(--ease) 0.1s both; }
  @keyframes draw { from { stroke-dashoffset: 264; } to { stroke-dashoffset: 24; } }
  .wordmark { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark span { color: var(--ink-faint); font-weight: 400; font-style: italic; }
  .saved-btn { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.71rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); padding: 0.6rem 0 0.6rem 0.6rem; min-height: 44px; }
  .saved-btn .seal-dot { display: inline-block; width: 0.48rem; height: 0.48rem; border-radius: 50%; background: var(--seal); margin-right: 0.42rem; vertical-align: 0.03rem; }
  .tagline { color: var(--ink-faint); font-style: italic; font-size: 0.95rem; margin-bottom: 2.2rem; }

  .book-row {
    display: flex; align-items: center; gap: 1.1rem; width: 100%; text-align: left;
    padding: 1.45rem 0 1.4rem; border-bottom: 1px solid var(--hairline);
    animation: settle 0.55s var(--ease) both; animation-delay: var(--d, 0s);
  }
  .book-row:first-of-type { border-top: 1px solid var(--hairline); }
  .row-main { flex: 1; min-width: 0; }
  .mode-line { display: block; margin-bottom: 0.5rem; }
  .book-title { display: block; font-size: 1.34rem; line-height: 1.28; font-weight: 600; margin-bottom: 0.15rem; text-wrap: balance; }
  .book-author { display: block; color: var(--ink-soft); font-size: 0.94rem; font-style: italic; }
  .row-side { flex-shrink: 0; display: grid; place-items: center; gap: 0.35rem; }
  .row-side .enso-mini { width: 3.1rem; height: 3.1rem; }
  .row-side .count { font-size: 0.62rem; letter-spacing: 0.1em; }

  .foot-note { margin-top: 2.6rem; text-align: center; }
  .foot-note .label { letter-spacing: 0.18em; }
  .empty-note { color: var(--ink-faint); font-style: italic; padding: 2rem 0; text-align: center; }

  /* ---------- Reader ---------- */
  .reader-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 0 1.1rem; }
  .reader-book {
    font-size: 0.71rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint);
    font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .read-progress { position: relative; height: 1px; background: var(--hairline); margin-bottom: 2rem; }
  .read-progress i { position: absolute; left: 0; top: -0.5px; height: 2px; background: var(--ink); transition: width 0.55s var(--ease); }

  .concept > * { animation: settle 0.55s var(--ease) both; animation-delay: var(--d, 0s); }
  @keyframes settle { from { opacity: 0; transform: translateY(0.55rem); } to { opacity: 1; transform: none; } }
  .concept.leave { animation: lift 0.18s ease both; }
  @keyframes lift { to { opacity: 0; transform: translateY(-0.4rem); } }

  .eyebrow { margin-bottom: 1rem; }
  .concept-title { font-size: clamp(1.72rem, 6.4vw, 2.1rem); line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 1.55rem; text-wrap: balance; }
  .hook { font-size: 1.28rem; line-height: 1.55; font-style: italic; }

  .layer { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.65s var(--ease), opacity 0.5s ease 0.05s; }
  .layer.open { grid-template-rows: 1fr; opacity: 1; }
  .layer-in { min-height: 0; overflow: hidden; }
  .layer-rule { display: flex; align-items: center; gap: 0.8rem; margin: 2rem 0 1.6rem; }
  .layer-rule::before, .layer-rule::after { content: ""; flex: 1; height: 1px; background: var(--hairline); transform: scaleX(0); transition: transform 0.9s var(--ease) 0.1s; }
  .layer-rule::before { transform-origin: right; }
  .layer-rule::after { transform-origin: left; }
  .layer.open .layer-rule::before, .layer.open .layer-rule::after { transform: scaleX(1); }
  .layer-in p { margin-bottom: 1.1rem; opacity: 0; transform: translateY(0.5rem); transition: opacity 0.5s ease, transform 0.5s var(--ease); }
  .layer-in p:last-of-type { margin-bottom: 0; }
  .layer.open .layer-in p { opacity: 1; transform: none; }
  .layer.open .layer-in p:nth-of-type(1) { transition-delay: 0.16s; }
  .layer.open .layer-in p:nth-of-type(2) { transition-delay: 0.24s; }
  .layer.open .layer-in p:nth-of-type(3) { transition-delay: 0.32s; }
  .layer.open .layer-in p:nth-of-type(4) { transition-delay: 0.4s; }
  .layer.open .layer-in p:nth-of-type(n+5) { transition-delay: 0.47s; }

  .unfold-btn {
    display: block; margin: 2.3rem auto 0; padding: 0.9rem 1.9rem; min-height: 48px;
    border: 1px solid var(--ink-soft); border-radius: 99px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.74rem; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--ink); transition: transform 0.15s ease, opacity 0.3s;
  }
  .unfold-btn:active { transform: scale(0.96); }
  .unfold-btn.hidden { display: none; }
  .unfold-btn.hint { animation: breathe 2.6s ease-in-out 1s infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--paper-rgb), 0); transform: scale(1); } 50% { transform: scale(1.035); } }

  .source-line { margin-top: 2rem; }
  .end-mark { text-align: center; margin-top: 2.5rem; color: var(--ink-faint); font-size: 1.05rem; letter-spacing: 0.5em; }

  /* ---------- Bottom bar ---------- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(to top, rgb(var(--paper-rgb)) 60%, rgba(var(--paper-rgb), 0));
    padding: 1.7rem 1.5rem calc(0.9rem + env(safe-area-inset-bottom));
    display: none;
  }
  .bar.active { display: block; }
  .bar-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .nav-btn { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); padding: 0.9rem 0.4rem; min-width: 4.2rem; min-height: 48px; }
  .nav-btn:disabled { color: var(--hairline); }
  .nav-btn.left { text-align: left; } .nav-btn.right { text-align: right; }

  .enso-btn { width: 3.9rem; height: 3.9rem; display: grid; place-items: center; }
  .enso-btn svg { width: 100%; height: 100%; overflow: visible; }
  .enso-stroke {
    fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round;
    stroke-dasharray: 300; stroke-dashoffset: 22; transform-origin: 50% 50%;
  }
  .enso-btn:active { transform: scale(0.94); }
  .enso-btn.spin .enso-stroke { animation: redraw 0.7s var(--ease); }
  @keyframes redraw { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 22; } }

  .seal-btn { width: 2.95rem; height: 2.95rem; display: grid; place-items: center; border: 1px solid var(--hairline); border-radius: 9px; transition: transform 0.16s ease, background 0.2s, border-color 0.2s; }
  .seal-btn:active { transform: scale(0.9); }
  .seal-btn .glyph { font-size: 1.05rem; color: var(--ink-faint); transition: color 0.2s; }
  .seal-btn.stamped { background: var(--seal); border-color: var(--seal); animation: stamp 0.32s var(--ease) both; }
  @keyframes stamp { 0% { transform: scale(1.18) rotate(1deg); } 55% { transform: scale(0.92) rotate(-5deg); } 100% { transform: scale(1) rotate(-3deg); } }
  .seal-btn.stamped .glyph { color: var(--paper); }

  /* ---------- Sheets (contents / saved) ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.28); opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-height: 85dvh; display: flex; flex-direction: column;
    background: var(--paper-deep); border-radius: 20px 20px 0 0;
    transform: translateY(103%); transition: transform 0.42s cubic-bezier(0.32, 0.72, 0.22, 1);
    padding: 0.55rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
    box-shadow: 0 -1px 0 var(--hairline);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip { width: 2.2rem; height: 4px; border-radius: 2px; background: var(--hairline); margin: 0.35rem auto 0.6rem; flex-shrink: 0; }
  .sheet-top { display: flex; justify-content: space-between; align-items: baseline; padding: 0.3rem 0 0.9rem; flex-shrink: 0; }
  .sheet-title { font-size: 1.28rem; font-weight: 600; }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; margin: 0 auto; width: 100%; max-width: var(--col); }
  .toc-section { margin: 1.5rem 0 0.4rem; }
  .toc-row { display: flex; align-items: baseline; gap: 0.8rem; width: 100%; text-align: left; padding: 0.85rem 0; border-bottom: 1px solid var(--hairline); min-height: 44px; }
  .toc-row:last-of-type { border-bottom: none; }
  .toc-mark { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.8rem; width: 1.2rem; flex-shrink: 0; color: var(--ink-faint); }
  .toc-mark.read { color: var(--ink); }
  .toc-mark.saved { color: var(--seal); }
  .toc-row .t { flex: 1; font-size: 1.01rem; line-height: 1.4; }
  .toc-row .b { font-size: 0.79rem; color: var(--ink-faint); font-style: italic; flex-shrink: 0; }

  /* ---------- The circle closes ---------- */
  .finis {
    position: fixed; inset: 0; z-index: 30; background: var(--paper);
    display: none; place-items: center; text-align: center; padding: 2rem;
  }
  .finis.active { display: grid; }
  .finis-inner { display: grid; place-items: center; gap: 1.2rem; max-width: 26rem; }
  .finis-enso { width: 8.5rem; height: 8.5rem; }
  .finis-enso .stroke { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; }
  .finis.active .finis-enso .stroke { animation: close-circle 1.7s var(--ease) 0.2s forwards; }
  @keyframes close-circle { to { stroke-dashoffset: 0; } }
  .finis-book { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .finis-note { color: var(--ink-soft); font-style: italic; }
  .finis .label { margin-top: 1.6rem; letter-spacing: 0.18em; opacity: 0; animation: settle 0.6s ease 1.9s both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .finis-enso .stroke { stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body class="booting">

<!-- ============ LIBRARY ============ -->
<main id="library" class="screen active">
  <div class="masthead">
    <div class="brand">
      <svg class="enso-mark" viewBox="0 0 100 100" aria-hidden="true"><circle class="stroke" cx="50" cy="50" r="42" transform="rotate(-64 50 50)"/></svg>
      <h1 class="wordmark">Unfold<span>.</span></h1>
    </div>
    <button class="saved-btn" onclick="openSheet('saved')"><span class="seal-dot"></span><span id="saved-count">Saved</span></button>
  </div>
  <p class="tagline">Books, one idea at a time.</p>
  <div id="book-list"></div>
  <div class="foot-note"><span class="label">To add a book, read the README</span></div>
</main>

<!-- ============ READER ============ -->
<main id="reader" class="screen">
  <div class="reader-top">
    <button class="quiet-btn" onclick="history.back()">&larr; Library</button>
    <div class="reader-book" id="reader-book-title"></div>
    <button class="quiet-btn" onclick="openSheet('contents')">Contents</button>
  </div>
  <div class="read-progress"><i id="read-progress-fill"></i></div>
  <article class="concept" id="concept"></article>
</main>

<!-- ============ BOTTOM BAR ============ -->
<nav class="bar" id="bar">
  <div class="bar-inner" id="bar-inner"></div>
</nav>

<!-- ============ SHEET ============ -->
<div class="scrim" id="scrim" onclick="history.back()"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-grip"></div>
  <div class="sheet-top">
    <div class="sheet-title" id="sheet-title"></div>
    <button class="quiet-btn" onclick="history.back()">Close</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<!-- ============ THE CIRCLE CLOSES ============ -->
<div class="finis" id="finis" onclick="closeFinis()">
  <div class="finis-inner">
    <svg class="finis-enso" viewBox="0 0 100 100" aria-hidden="true"><circle class="stroke" cx="50" cy="50" r="42" transform="rotate(-64 50 50)"/></svg>
    <div class="finis-book" id="finis-book"></div>
    <p class="finis-note" id="finis-note"></p>
    <span class="label">Tap to return</span>
  </div>
</div>

<script src="books/manifest.js"></script>
<script>
/* ================= STATE ================= */
window.__BOOKS = [];
window.registerBook = function (book) { window.__BOOKS.push(book); };

const STORE_KEY = "unfold-state-v1";
let S = { read: {}, saved: {}, pos: {}, flags: {} };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
S.flags = S.flags || {};
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let current = { book: null, index: 0, layer: 1 };
let sheetOpen = false;
let readerActive = false;

/* ================= BOOK LOADING ================= */
function loadBooks() {
  const files = window.BOOK_FILES || [];
  let remaining = files.length;
  if (!remaining) { renderLibrary(); return; }
  files.forEach(f => {
    const s = document.createElement("script");
    s.src = "books/" + f;
    s.onload = s.onerror = () => { if (--remaining === 0) renderLibrary(); };
    document.body.appendChild(s);
  });
}

/* ================= HELPERS ================= */
function bookById(id) { return window.__BOOKS.find(b => b.id === id); }
function readSet(b) { return S.read[b.id] || (S.read[b.id] = {}); }
function savedSet(b) { return S.saved[b.id] || (S.saved[b.id] = {}); }
function readCount(b) { return b.concepts.filter(c => readSet(b)[c.id]).length; }
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function paras(t) { return t.split(/\n\n+/).map(p => "<p>" + esc(p) + "</p>").join(""); }
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* An ensō that closes as the book is read: the progress indicator IS the mark. */
function ensoArc(done, total, sealed) {
  const C = 251.3;                                  /* 2πr, r=40 */
  const gap = 0.11 * C;                             /* the ensō's resting gap */
  const pct = total ? done / total : 0;
  const len = pct >= 1 ? C : Math.max(0.05 * C, pct * (C - gap));
  return `<svg class="enso-mini${sealed ? " sealed" : ""}" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="40"/>
    <circle class="arc" cx="50" cy="50" r="40" stroke-dasharray="${len.toFixed(1)} ${C}" transform="rotate(-78 50 50)"/>
  </svg>`;
}

/* ================= LIBRARY ================= */
function renderLibrary() {
  const list = document.getElementById("book-list");
  if (!window.__BOOKS.length) {
    list.innerHTML = '<p class="empty-note">No books here yet. Add one: open books/manifest.js and follow the README.</p>';
    return;
  }
  list.innerHTML = window.__BOOKS.map((b, i) => {
    const done = readCount(b), total = b.concepts.length;
    const modeGlyph = b.mode === "sequential" ? "In order &rarr;" : "Shuffle &infin;";
    return `
      <button class="book-row" style="--d:${(i * 0.07).toFixed(2)}s" onclick="openBook('${b.id}')">
        <span class="row-main">
          <span class="label mode-line">${modeGlyph}</span>
          <span class="book-title">${esc(b.title)}</span>
          <span class="book-author">${esc(b.author)}</span>
        </span>
        <span class="row-side">
          ${ensoArc(done, total, done === total && total > 0)}
          <span class="label count">${done} / ${total}</span>
        </span>
      </button>`;
  }).join("");
  const totalSaved = window.__BOOKS.reduce((n, b) => n + Object.keys(S.saved[b.id] || {}).length, 0);
  document.getElementById("saved-count").textContent = totalSaved ? `Saved · ${totalSaved}` : "Saved";
}

function exitReader() {
  readerActive = false;
  document.getElementById("reader").classList.remove("active");
  document.getElementById("bar").classList.remove("active");
  document.getElementById("library").classList.add("active");
  renderLibrary();
  window.scrollTo(0, 0);
}

/* ================= READER ================= */
function openBook(id) {
  const b = bookById(id);
  if (!b) return;
  current.book = b;
  if (b.mode === "sequential") {
    current.index = Math.min(S.pos[b.id] || 0, b.concepts.length - 1);
  } else {
    current.index = pickShuffleIndex(b, true);
  }
  history.pushState({ v: "reader" }, "");
  enterReader();
}

function enterReader() {
  readerActive = true;
  document.getElementById("library").classList.remove("active");
  document.getElementById("reader").classList.add("active");
  document.getElementById("bar").classList.add("active");
  current.layer = 1;
  renderConcept();
  renderBar();
  window.scrollTo(0, 0);
}

function pickShuffleIndex(b, allowCurrentFirstLoad) {
  const unread = b.concepts.map((c, i) => readSet(b)[c.id] ? -1 : i).filter(i => i >= 0);
  const pool = unread.length ? unread : b.concepts.map((_, i) => i);
  let pick = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && !allowCurrentFirstLoad) {
    while (pick === current.index) pick = pool[Math.floor(Math.random() * pool.length)];
  }
  return pick;
}

function renderConcept() {
  const b = current.book, c = b.concepts[current.index];
  document.getElementById("reader-book-title").textContent = b.title;
  updateProgressLine();
  const hint = S.flags.everUnfolded ? "" : " hint";
  const el = document.getElementById("concept");
  el.classList.remove("leave");
  el.innerHTML = `
    <div class="label eyebrow" style="--d:0.04s">${esc(c.section || "")}</div>
    <h2 class="concept-title" style="--d:0.1s">${esc(c.title)}</h2>
    <p class="hook" style="--d:0.18s">${esc(c.hook)}</p>

    <div class="layer" id="layer-idea"><div class="layer-in">
      <div class="layer-rule"><span class="label">The idea</span></div>
      ${paras(c.idea)}
    </div></div>

    <div class="layer" id="layer-deep"><div class="layer-in">
      <div class="layer-rule"><span class="label">Going deeper</span></div>
      ${paras(c.deep)}
      ${c.source ? `<div class="source-line label">${esc(c.source)}</div>` : ""}
      <div class="end-mark">&#8226;&#8226;&#8226;</div>
    </div></div>

    <button class="unfold-btn${hint}" id="unfold" style="--d:0.28s" onclick="unfold()">Unfold the idea</button>
  `;
  updateSealBtn();
}

function updateProgressLine() {
  const b = current.book;
  if (!b) return;
  const total = b.concepts.length;
  const pct = b.mode === "sequential"
    ? ((current.index + 1) / total) * 100
    : (readCount(b) / total) * 100;
  document.getElementById("read-progress-fill").style.width = pct + "%";
}

function unfold() {
  const btn = document.getElementById("unfold");
  if (current.layer === 1) {
    document.getElementById("layer-idea").classList.add("open");
    btn.textContent = "Go deeper";
    btn.classList.remove("hint");
    current.layer = 2;
    if (!S.flags.everUnfolded) { S.flags.everUnfolded = true; }
    markRead();
  } else if (current.layer === 2) {
    document.getElementById("layer-deep").classList.add("open");
    btn.classList.add("hidden");
    current.layer = 3;
  }
}

function markRead() {
  const b = current.book, c = b.concepts[current.index];
  if (!readSet(b)[c.id]) {
    readSet(b)[c.id] = true; save();
    renderBar(); updateProgressLine();
    if (readCount(b) === b.concepts.length && !S.flags["done-" + b.id]) {
      S.flags["done-" + b.id] = true; save();
      setTimeout(() => showFinis(b), 900);
    }
  } else { save(); }
}

/* ================= BOTTOM BAR ================= */
function renderBar() {
  const b = current.book;
  if (!b) return;
  const inner = document.getElementById("bar-inner");
  const done = readCount(b), total = b.concepts.length;
  if (b.mode === "sequential") {
    inner.innerHTML = `
      <button class="nav-btn left" id="prev-btn" onclick="step(-1)">&larr; Prev</button>
      <div style="text-align:center">
        <div class="label" style="margin-bottom:0.5rem">${current.index + 1} of ${total}</div>
        <button class="seal-btn" id="seal" onclick="toggleSaved()" aria-label="Save this idea"><span class="glyph">&#10047;</span></button>
      </div>
      <button class="nav-btn right" id="next-btn" onclick="step(1)">Next &rarr;</button>`;
    document.getElementById("prev-btn").disabled = current.index === 0;
    document.getElementById("next-btn").disabled = current.index === total - 1;
  } else {
    inner.innerHTML = `
      <div class="label" style="min-width:4.2rem">${done} / ${total}<br>read</div>
      <button class="enso-btn" id="enso" onclick="shuffle()" aria-label="Shuffle to a new idea">
        <svg viewBox="0 0 100 100"><circle class="enso-stroke" cx="50" cy="50" r="42" transform="rotate(-64 50 50)"/></svg>
      </button>
      <div style="min-width:4.2rem;display:flex;justify-content:flex-end">
        <button class="seal-btn" id="seal" onclick="toggleSaved()" aria-label="Save this idea"><span class="glyph">&#10047;</span></button>
      </div>`;
  }
  updateSealBtn();
}

function updateSealBtn() {
  const sealBtn = document.getElementById("seal");
  if (!sealBtn || !current.book) return;
  const c = current.book.concepts[current.index];
  sealBtn.classList.toggle("stamped", !!savedSet(current.book)[c.id]);
}

function swapConcept(fn) {
  const el = document.getElementById("concept");
  el.classList.add("leave");
  setTimeout(() => { fn(); renderConcept(); renderBar(); window.scrollTo(0, 0); }, 180);
}

function step(dir) {
  const b = current.book;
  const next = current.index + dir;
  if (next < 0 || next >= b.concepts.length) return;
  swapConcept(() => {
    current.index = next;
    S.pos[b.id] = next; save();
    current.layer = 1;
  });
}

function shuffle() {
  const enso = document.getElementById("enso");
  if (enso) { enso.classList.remove("spin"); void enso.offsetWidth; enso.classList.add("spin"); }
  swapConcept(() => {
    current.index = pickShuffleIndex(current.book, false);
    current.layer = 1;
  });
}

function toggleSaved() {
  const b = current.book, c = b.concepts[current.index];
  if (savedSet(b)[c.id]) delete savedSet(b)[c.id];
  else { savedSet(b)[c.id] = true; buzz(8); }
  save();
  updateSealBtn();
}

/* ================= SWIPE ================= */
(function () {
  const zone = document.getElementById("reader");
  let x0 = 0, y0 = 0;
  zone.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  zone.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 64 && Math.abs(dy) < 48 && readerActive && !sheetOpen) {
      if (current.book.mode === "sequential") step(dx < 0 ? 1 : -1);
      else shuffle();
    }
  }, { passive: true });
})();

/* ================= SHEETS ================= */
function openSheet(kind) {
  buildSheet(kind);
  history.pushState({ v: "sheet" }, "");
  sheetOpen = true;
  document.getElementById("scrim").classList.add("open");
  document.getElementById("sheet").classList.add("open");
}

function hideSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}

function buildSheet(kind) {
  const title = document.getElementById("sheet-title");
  const body = document.getElementById("sheet-body");
  if (kind === "contents") {
    const b = current.book;
    title.textContent = "Contents";
    let html = "", lastSection = null;
    b.concepts.forEach((c, i) => {
      if (c.section && c.section !== lastSection) {
        html += `<div class="label toc-section">${esc(c.section)}</div>`;
        lastSection = c.section;
      }
      const isRead = !!readSet(b)[c.id], isSaved = !!savedSet(b)[c.id];
      const mark = isSaved ? '<span class="toc-mark saved">&#10047;</span>'
                 : isRead ? '<span class="toc-mark read">&#10003;</span>'
                 : '<span class="toc-mark">&#9675;</span>';
      html += `<button class="toc-row" onclick="jumpTo(${i})">${mark}<span class="t">${esc(c.title)}</span></button>`;
    });
    body.innerHTML = html;
  } else {
    title.textContent = "Saved ideas";
    let html = "";
    window.__BOOKS.forEach(b => {
      b.concepts.forEach((c, i) => {
        if (savedSet(b)[c.id]) {
          html += `<button class="toc-row" onclick="openSavedConcept('${b.id}',${i})">
            <span class="toc-mark saved">&#10047;</span>
            <span class="t">${esc(c.title)}</span>
            <span class="b">${esc(b.title.length > 22 ? b.title.slice(0, 22) + "…" : b.title)}</span>
          </button>`;
        }
      });
    });
    body.innerHTML = html || '<p class="empty-note">Nothing saved yet. Stamp the seal on ideas worth returning to.</p>';
  }
  body.scrollTop = 0;
}

function jumpTo(i) {
  current.index = i;
  if (current.book.mode === "sequential") { S.pos[current.book.id] = i; save(); }
  current.layer = 1;
  renderConcept(); renderBar();
  window.scrollTo(0, 0);
  history.back();
}

function openSavedConcept(bookId, i) {
  current.book = bookById(bookId);
  current.index = i;
  hideSheet();
  history.replaceState({ v: "reader" }, "");
  enterReader();
}

/* ================= THE CIRCLE CLOSES ================= */
function showFinis(b) {
  document.getElementById("finis-book").textContent = b.title;
  document.getElementById("finis-note").textContent =
    `The circle closes. ${b.concepts.length} ideas, all unfolded.`;
  const f = document.getElementById("finis");
  f.classList.remove("active"); void f.offsetWidth;
  f.classList.add("active");
  buzz([12, 60, 12]);
}
function closeFinis() { document.getElementById("finis").classList.remove("active"); }

/* ================= HISTORY / BACK ================= */
window.addEventListener("popstate", () => {
  if (sheetOpen) { hideSheet(); return; }
  if (readerActive) exitReader();
});

/* ================= KEYBOARD ================= */
document.addEventListener("keydown", e => {
  if (!readerActive || sheetOpen) return;
  if (e.key === "ArrowRight") { current.book.mode === "sequential" ? step(1) : shuffle(); }
  else if (e.key === "ArrowLeft") { if (current.book.mode === "sequential") step(-1); }
  else if (e.key === "Enter" || e.key === " ") {
    const btn = document.getElementById("unfold");
    if (btn && !btn.classList.contains("hidden") && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); unfold(); }
  }
});

/* ================= BOOT ================= */
loadBooks();
setTimeout(() => document.body.classList.remove("booting"), 1600);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
