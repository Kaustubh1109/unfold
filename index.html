<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unfold</title>
<meta name="description" content="Books. One idea at a time.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EEE3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unfold">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  /* ============================================================
     UNFOLD — cream, core, ochre. One grotesque, one monospace.
     Nothing is rounded. Nothing decorates. The block meter is
     the book: one block per idea, filled as you read it.

     Two line weights, on purpose: --line is a whisper (dividing
     rules), --line-strong holds an edge (controls, meter blocks)
     because a hairline that read fine on bone washes out on cream.
     Two ochres, same reason: --ochre fills area, --ochre-deep
     carries small marks and text where 3:1 isn't enough.
     ============================================================ */
  :root {
    --paper:       #F2EEE3;   /* cream */
    --raised:      #FAF8F1;   /* salt */
    --ink:         #141210;   /* soft core — pure black halates on cream */
    --mid:         #6B6558;   /* concrete */
    --line:        #D5CEBC;   /* dividing rules */
    --line-strong: #C2B8A2;   /* control edges, meter blocks */
    --ochre:       #B07D2B;   /* the only accent. saved things only. */
    --ochre-deep:  #8A6018;   /* same accent, small marks + text */
    --paper-rgb: 242, 238, 227;

    --sans: "Helvetica Neue", Helvetica, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --pad: 1.25rem;
    --snap: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:       #1A1917;   /* onyx */
      --raised:      #262421;
      --ink:         #F2EEE3;   /* cream */
      --mid:         #948D7D;
      --line:        #33302A;
      --line-strong: #45413A;
      --ochre:       #C89440;   /* accent goes up, not down, on onyx */
      --ochre-deep:  #D9A855;
      --paper-rgb: 26, 25, 23;
    }
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.055rem;
    line-height: 1.72;
    font-weight: 400;
    min-height: 100vh;
    overscroll-behavior-y: none;
    text-rendering: optimizeLegibility;
    /* NOT antialiased: on a ground this bright it thins reading text
       to the point of glare. Subpixel keeps the body solid. */
    -webkit-font-smoothing: auto;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--ochre-deep); outline-offset: 2px; }

  /* ---------- type roles ---------- */
  .mono {
    font-family: var(--mono); font-size: 0.645rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--mid); font-weight: 500;
  }
  .display {
    font-weight: 700; text-transform: uppercase; letter-spacing: -0.03em;
    line-height: 0.96; text-wrap: balance;
    /* the inverse of the body rule: huge caps go antialiased so the
       black mass stays crisp instead of clotting on cream */
    -webkit-font-smoothing: antialiased;
  }

  .screen { display: none; padding: 0 var(--pad) calc(3.5rem + env(safe-area-inset-bottom)); }
  .screen.active { display: block; }

  /* ================= LIBRARY ================= */
  .masthead { display: flex; align-items: flex-start; justify-content: space-between; padding: 1.5rem 0 0.35rem; gap: 1rem; }
  .wordmark { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.045em; line-height: 1; text-transform: uppercase; -webkit-font-smoothing: antialiased; }
  .saved-btn { padding: 0.35rem 0 0.35rem 0.75rem; min-height: 44px; display: flex; align-items: flex-start; }
  .saved-btn .mono { color: var(--ink); }
  .saved-btn .dot { display: inline-block; width: 0.45rem; height: 0.45rem; background: var(--ochre-deep); margin-right: 0.4rem; vertical-align: 0.02rem; }
  .sub { padding-bottom: 1.6rem; }

  .book-row {
    display: block; width: 100%; text-align: left;
    padding: 1.35rem 0 1.45rem; border-top: 1px solid var(--line);
  }
  .book-row:last-of-type { border-bottom: 1px solid var(--line); }
  .book-row .spec { display: block; margin-bottom: 0.8rem; }
  .book-row .name { display: block; font-size: clamp(1.6rem, 7.4vw, 2rem); margin-bottom: 0.4rem; }
  .book-row .by { display: block; margin-bottom: 1rem; }
  .book-row .stat { display: block; margin-top: 0.75rem; }
  .book-row .stat b { color: var(--ink); font-weight: 500; }

  .colophon { padding: 2.4rem 0 0; }

  /* ---------- THE BLOCK METER ---------- */
  .meter { display: flex; gap: 2px; width: 100%; align-items: stretch; }
  .meter.tall { gap: 3px; }
  .blk {
    flex: 1 1 0; min-width: 0; height: 13px; border: 1px solid var(--line-strong);
    background: transparent; padding: 0; transition: background 0.2s var(--snap), border-color 0.2s var(--snap);
  }
  .meter.tall .blk { height: 22px; }
  .blk.read  { background: var(--ink); border-color: var(--ink); }
  .blk.saved { background: var(--ochre); border-color: var(--ochre); }
  .blk.here  { border-color: var(--ochre-deep); border-width: 2px; }
  .meter.tall .blk.here { background: var(--ochre); border-color: var(--ochre); }

  /* ================= READER ================= */
  .reader-top { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.9rem; }
  /* scoped to the plain text buttons only — .readbtn/.savebtn size themselves */
  .reader-top > button, .reader-top button.mono { padding: 0.5rem 0; min-height: 44px; display: flex; align-items: center; }
  .reader-rail { padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
  .railtop { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.6rem; }
  .railtop .bookname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .concept { padding-top: 1.7rem; }
  .concept.out { opacity: 0; transition: opacity 0.12s linear; }
  .concept.in  { animation: rise 0.26s var(--snap) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* the one rounded thing in the app: the section tag */
  .pill { display: inline-block; padding: 0.34rem 0.8rem 0.3rem; border: 1px solid var(--line-strong); border-radius: 999px; margin-bottom: 1.15rem; }
  .concept-title { font-size: clamp(2.15rem, 10.2vw, 3.05rem); margin-bottom: 1.5rem; }
  .taphint { display: block; margin-top: 1.9rem; opacity: 0.45; }
  /* --tsize scales the reading prose only: hook, idea, deeper. Titles, mono
     labels and every control stay put, so the page furniture never moves. */
  .hook { font-size: calc(1.2rem * var(--tsize, 1)); line-height: 1.45; font-weight: 400; letter-spacing: -0.012em; max-width: 34ch; }

  .layer { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.38s var(--snap), opacity 0.22s linear; }
  .layer.open { grid-template-rows: 1fr; opacity: 1; }
  .layer-in { min-height: 0; overflow: hidden; }
  .layer-head { display: flex; align-items: center; gap: 0.75rem; margin: 2.3rem 0 1.5rem; }
  .layer-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .layer-in p { font-size: calc(1.055rem * var(--tsize, 1)); margin-bottom: 1.09em; }
  .layer-in p:last-of-type { margin-bottom: 0; }
  .srcline { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }

  /* ================= READER CONTROLS ================= */
  .ctrl { display: flex; align-items: center; gap: 0.5rem; }
  .meter-wrap { flex: 1; min-width: 0; }

  .arrow {
    width: 38px; height: 34px; flex-shrink: 0; display: grid; place-items: center;
    border: 1px solid var(--line-strong); transition: opacity 0.14s linear;
  }
  .arrow:disabled { opacity: 0.28; }
  .arrow:active { background: var(--line-strong); }
  .arrow svg { width: 12px; height: 12px; display: block; }
  .arrow svg path { fill: none; stroke: var(--ink); stroke-width: 1.9; stroke-linecap: square; }

  .readbtn {
    padding: 0 0.72rem; height: 34px; display: flex; align-items: center;
    border: 1px solid var(--line-strong); transition: background 0.14s linear, border-color 0.14s linear;
  }
  .readbtn.on { background: var(--ink); border-color: var(--ink); }
  .readbtn.on .mono { color: var(--paper); }

  /* sizes the reading text and nothing else. Same 34px box as .readbtn/.arrow
     so it reads as one of the controls, not a new species. */
  .sizebtn {
    flex-shrink: 0; height: 34px; padding: 0 0.6rem; display: flex; align-items: center;
    border: 1px solid var(--line-strong); transition: background 0.14s linear;
  }
  .sizebtn:active { background: var(--line-strong); }

  .savebtn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-strong); transition: border-color 0.14s linear; }
  .savebtn svg { width: 12px; height: 16px; display: block; }
  .savebtn svg path { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .savebtn.on { border-color: var(--ochre); }
  .savebtn.on svg path { fill: var(--ochre); stroke: var(--ochre-deep); }

  /* ================= PANEL (contents / saved) ================= */
  .panel {
    position: fixed; inset: 0; z-index: 20; background: var(--raised);
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.28s var(--snap);
    visibility: hidden;
  }
  .panel.open { transform: translateY(0); visibility: visible; }
  .panel-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem var(--pad); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .panel-title { font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; }
  .panel-top button { padding: 0.5rem 0 0.5rem 1rem; min-height: 44px; }
  .panel-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--pad) calc(2rem + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .sect { padding: 1.6rem 0 0.7rem; }
  .toc {
    display: flex; align-items: baseline; gap: 0.85rem; width: 100%; text-align: left;
    padding: 0.85rem 0; border-top: 1px solid var(--line); min-height: 46px;
  }
  .toc .num { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.08em; color: var(--mid); width: 1.6rem; flex-shrink: 0; }
  .toc .t { flex: 1; font-size: 1.02rem; line-height: 1.32; }
  .toc.done .t { color: var(--mid); }
  .toc.mark .num { color: var(--ochre-deep); }
  .toc .from { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blank { padding: 3rem 0; color: var(--mid); }

  /* ================= COMPLETE ================= */
  .complete {
    position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--paper);
    display: none; flex-direction: column; justify-content: space-between;
    padding: calc(2.5rem + env(safe-area-inset-top)) var(--pad) calc(2.5rem + env(safe-area-inset-bottom));
  }
  .complete.active { display: flex; }
  .complete .mono { color: var(--paper); opacity: 0.55; }
  .complete-mid { display: flex; flex-direction: column; justify-content: center; flex: 1; }
  /* the completion screen inverts the scheme — light type on dark reads
     heavier, so this one keeps its tight tracking and antialiasing */
  .complete-word { font-size: clamp(3.2rem, 17vw, 5.2rem); font-weight: 700; text-transform: uppercase; letter-spacing: -0.05em; line-height: 0.88; -webkit-font-smoothing: antialiased; }
  .complete-book { margin-top: 1.6rem; font-size: 1.15rem; line-height: 1.3; max-width: 22ch; }
  .complete .meter { margin-top: 2rem; }
  .complete .blk { background: var(--paper); border-color: var(--paper); height: 10px; }
  .complete-mid > * { animation: rise 0.5s var(--snap) both; }
  .complete-mid > :nth-child(2) { animation-delay: 0.09s; }
  .complete-mid > :nth-child(3) { animation-delay: 0.18s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ================= LIBRARY ================= -->
<main id="library" class="screen active">
  <div class="masthead">
    <h1 class="wordmark">Unfold</h1>
    <button class="saved-btn" onclick="openPanel('saved')"><span class="mono"><span class="dot"></span><span id="saved-count">Saved</span></span></button>
  </div>
  <p class="mono sub">Books · one idea at a time</p>
  <div id="book-list"></div>
  <p class="mono colophon">To add a book, read the readme</p>
</main>

<!-- ================= READER ================= -->
<main id="reader" class="screen">
  <div class="reader-top">
    <button class="mono" onclick="history.back()">← Library</button>
    <div class="ctrl">
      <button class="readbtn" id="readbtn" onclick="toggleRead()" aria-pressed="false"><span class="mono">Read</span></button>
      <button class="savebtn" id="savebtn" onclick="toggleSave()" aria-pressed="false" aria-label="Save this idea">
        <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1 h10 v14 l-5 -4 -5 4 z"/></svg>
      </button>
      <button class="mono" onclick="openPanel('contents')">Contents</button>
    </div>
  </div>
  <div class="reader-rail">
    <div class="railtop">
      <span class="mono bookname" id="reader-book"></span>
      <button class="mono sizebtn" id="sizebtn" onclick="cycleSize()" aria-label="Text size"></button>
    </div>
    <div class="ctrl">
      <button class="arrow" id="prev" onclick="step(-1)" aria-label="Previous idea">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 1 L3 6 L8 11"/></svg>
      </button>
      <div class="meter-wrap"><div class="meter" id="reader-meter"></div></div>
      <button class="arrow" id="next" onclick="goNext()" aria-label="Next idea">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1 L9 6 L4 11"/></svg>
      </button>
    </div>
  </div>
  <article class="concept" id="concept"></article>
</main>

<!-- ================= PANEL ================= -->
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel-top">
    <h2 class="panel-title" id="panel-title"></h2>
    <button class="mono" onclick="history.back()">Close</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</section>

<!-- ================= COMPLETE ================= -->
<div class="complete" id="complete" onclick="closeComplete()">
  <span class="mono" id="complete-top"></span>
  <div class="complete-mid">
    <div class="complete-word">Complete</div>
    <div class="complete-book display" id="complete-book"></div>
    <div class="meter" id="complete-meter"></div>
  </div>
  <span class="mono">Tap to return</span>
</div>

<script src="books/manifest.js"></script>
<script>
/* ================= STATE ================= */
window.__BOOKS = [];
window.registerBook = function (book) { window.__BOOKS.push(book); };

const STORE_KEY = "unfold-state-v1";
let S = { read: {}, saved: {}, pos: {}, flags: {} };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
S.flags = S.flags || {};
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let current = { book: null, index: 0, layer: 1 };
let panelOpen = false, readerOn = false;

/* ================= LOADING ================= */
function loadBooks() {
  const files = window.BOOK_FILES || [];
  let remaining = files.length;
  if (!remaining) { renderLibrary(); return; }
  const order = files.map(f => f.replace(/\.js$/, ""));
  files.forEach(f => {
    const s = document.createElement("script");
    s.src = "books/" + f;
    s.onload = s.onerror = () => {
      if (--remaining === 0) {
        /* scripts resolve in network order — restore manifest order (filename = id, per README) */
        window.__BOOKS.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        renderLibrary();
      }
    };
    document.body.appendChild(s);
  });
}

/* ================= HELPERS ================= */
function bookById(id) { return window.__BOOKS.find(b => b.id === id); }
function readSet(b) { return S.read[b.id] || (S.read[b.id] = {}); }
function savedSet(b) { return S.saved[b.id] || (S.saved[b.id] = {}); }
function readCount(b) { return b.concepts.filter(c => readSet(b)[c.id]).length; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function paras(t) { return t.split(/\n\n+/).map(p => "<p>" + esc(p) + "</p>").join(""); }
function pad2(n) { return n < 10 ? "0" + n : String(n); }
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }

/* One block per idea. Filled = read. Ochre = saved. Ringed = where you are. */
function meterHTML(b, opts) {
  const o = opts || {};
  return b.concepts.map((c, i) => {
    const cls = ["blk"];
    if (savedSet(b)[c.id]) cls.push("saved");
    else if (readSet(b)[c.id]) cls.push("read");
    if (o.here === i) cls.push("here");
    return o.jump
      ? `<button class="${cls.join(" ")}" onclick="jumpTo(${i})" aria-label="Idea ${i + 1}: ${esc(c.title)}"></button>`
      : `<span class="${cls.join(" ")}"></span>`;
  }).join("");
}

/* ================= LIBRARY ================= */
function renderLibrary() {
  const list = document.getElementById("book-list");
  if (!window.__BOOKS.length) {
    list.innerHTML = '<p class="blank">No books loaded. Add one to books/manifest.js — the readme explains it.</p>';
    return;
  }
  list.innerHTML = window.__BOOKS.map(b => {
    const done = readCount(b), total = b.concepts.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const mode = b.mode === "sequential" ? "Sequence" : "Shuffle";
    const stat = done === total
      ? "Complete"
      : `<b>${pad2(done)}</b> of ${pad2(total)} read · ${pct}%`;
    return `
      <button class="book-row" onclick="openBook('${b.id}')">
        <span class="mono spec">${mode} · ${total} ideas</span>
        <span class="name display">${esc(b.title)}</span>
        <span class="mono by">${esc(b.author)}</span>
        <span class="meter">${meterHTML(b, {})}</span>
        <span class="mono stat">${stat}</span>
      </button>`;
  }).join("");
  const totalSaved = window.__BOOKS.reduce((n, b) => n + Object.keys(S.saved[b.id] || {}).length, 0);
  document.getElementById("saved-count").textContent = totalSaved ? "Saved · " + totalSaved : "Saved";
}

/* ================= READER ================= */
function openBook(id) {
  const b = bookById(id);
  if (!b) return;
  current.book = b;
  current.index = b.mode === "sequential"
    ? Math.min(S.pos[b.id] || 0, b.concepts.length - 1)
    : pickShuffle(b, true);
  history.pushState({ v: "reader" }, "");
  enterReader();
}

function enterReader() {
  readerOn = true;
  document.getElementById("library").classList.remove("active");
  document.getElementById("reader").classList.add("active");
  current.layer = 1;
  render();
  window.scrollTo(0, 0);
}

function exitReader() {
  readerOn = false;
  document.getElementById("reader").classList.remove("active");
  document.getElementById("library").classList.add("active");
  renderLibrary();
  window.scrollTo(0, 0);
}

function pickShuffle(b, first) {
  const unread = b.concepts.map((c, i) => readSet(b)[c.id] ? -1 : i).filter(i => i >= 0);
  const pool = unread.length ? unread : b.concepts.map((_, i) => i);
  let pick = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && !first) {
    while (pick === current.index) pick = pool[Math.floor(Math.random() * pool.length)];
  }
  return pick;
}

function render() {
  const b = current.book, c = b.concepts[current.index];
  document.getElementById("reader-book").textContent = b.title;
  document.getElementById("reader-meter").innerHTML = meterHTML(b, { here: current.index, jump: true });

  const el = document.getElementById("concept");
  el.className = "concept in";
  el.innerHTML = `
    ${c.section ? `<span class="mono pill">${esc(c.section)}</span>` : ""}
    <h2 class="concept-title display">${esc(c.title)}</h2>
    <p class="hook">${esc(c.hook)}</p>

    <div class="layer" id="layer-idea"><div class="layer-in">
      <div class="layer-head"><span class="mono">The idea</span></div>
      ${paras(c.idea)}
    </div></div>

    <div class="layer" id="layer-deep"><div class="layer-in">
      <div class="layer-head"><span class="mono">Deeper</span></div>
      ${paras(c.deep)}
      <div class="srcline"><span class="mono">Source</span><span class="mono">${esc(c.source || b.title)}</span></div>
    </div></div>

    <span class="mono taphint" id="taphint"></span>`;
  renderControls();
  updateHint();
}

function renderControls() {
  const b = current.book;
  if (!b) return;
  const c = b.concepts[current.index];
  const seq = b.mode === "sequential";
  const prev = document.getElementById("prev"), next = document.getElementById("next");

  prev.style.display = seq ? "grid" : "none";          /* no "previous" in a shuffle */
  prev.disabled = current.index === 0;
  next.disabled = seq && current.index === b.concepts.length - 1;

  const isRead = !!readSet(b)[c.id], isSaved = !!savedSet(b)[c.id];
  const rb = document.getElementById("readbtn");
  rb.classList.toggle("on", isRead);
  rb.setAttribute("aria-pressed", isRead);
  const sb = document.getElementById("savebtn");
  sb.classList.toggle("on", isSaved);
  sb.setAttribute("aria-pressed", isSaved);
}

/* The hint teaches the tap, then gets out of the way for good. */
function updateHint() {
  const h = document.getElementById("taphint");
  if (!h) return;
  const b = current.book;
  const last = b.mode === "sequential" && current.index === b.concepts.length - 1;
  const taught = (S.flags.taps || 0) >= 6;
  let text = "";
  if (current.layer === 3 && last) text = "End of book";
  else if (!taught) text = current.layer === 3 ? "Tap for the next idea" : "Tap to continue";
  h.textContent = text;
  h.style.display = text ? "block" : "none";
}

/* tap anywhere: hook → idea → deeper → the next idea */
function advance() {
  const b = current.book;
  if (current.layer === 1) {
    document.getElementById("layer-idea").classList.add("open");
    current.layer = 2;
    countTap(); markRead(); updateHint();
  } else if (current.layer === 2) {
    document.getElementById("layer-deep").classList.add("open");
    current.layer = 3;
    countTap(); updateHint();
  } else goNext();
}

function goNext() {
  const b = current.book;
  if (b.mode !== "sequential") { shuffle(); return; }
  if (current.index < b.concepts.length - 1) step(1);
}

function countTap() {
  if ((S.flags.taps || 0) < 6) { S.flags.taps = (S.flags.taps || 0) + 1; save(); }
}

function refreshMeter() {
  document.getElementById("reader-meter").innerHTML =
    meterHTML(current.book, { here: current.index, jump: true });
}

function markRead() {
  const b = current.book, c = b.concepts[current.index];
  if (readSet(b)[c.id]) return;
  readSet(b)[c.id] = true; save();
  refreshMeter(); renderControls(); maybeComplete();
}

/* one button, both directions */
function toggleRead() {
  const b = current.book, c = b.concepts[current.index];
  if (readSet(b)[c.id]) {
    delete readSet(b)[c.id];
    delete S.flags["done-" + b.id];      /* re-finishing can celebrate again */
  } else {
    readSet(b)[c.id] = true; buzz(6);
  }
  save();
  refreshMeter(); renderControls(); maybeComplete();
}

function maybeComplete() {
  const b = current.book;
  if (readCount(b) === b.concepts.length && !S.flags["done-" + b.id]) {
    S.flags["done-" + b.id] = true; save();
    setTimeout(() => showComplete(b), 650);
  }
}

function swap(fn) {
  const el = document.getElementById("concept");
  el.className = "concept out";
  setTimeout(() => { fn(); render(); window.scrollTo(0, 0); }, 120);
}

function step(dir) {
  const b = current.book, next = current.index + dir;
  if (next < 0 || next >= b.concepts.length) return;
  swap(() => { current.index = next; S.pos[b.id] = next; save(); current.layer = 1; });
}

function shuffle() {
  swap(() => { current.index = pickShuffle(current.book, false); current.layer = 1; });
}

function toggleSave() {
  const b = current.book, c = b.concepts[current.index];
  if (savedSet(b)[c.id]) delete savedSet(b)[c.id];
  else { savedSet(b)[c.id] = true; buzz(9); }
  save();
  renderControls(); refreshMeter();
}

/* ================= TEXT SIZE ================= */
/* One button, four steps, wrapping back to S. Drives --tsize, which only
   .hook and .layer-in p read — so the reading grows and the furniture
   (titles, meter, controls, library, panels) stays exactly where it was. */
const TSIZES = [
  { name: "S",  scale: 0.92 },
  { name: "M",  scale: 1 },
  { name: "L",  scale: 1.12 },
  { name: "XL", scale: 1.26 }
];

function sizeIndex() {
  const i = S.flags.tsize;
  return (typeof i === "number" && i >= 0 && i < TSIZES.length) ? i : 1;   /* M by default */
}

function applySize() {
  const t = TSIZES[sizeIndex()];
  document.documentElement.style.setProperty("--tsize", t.scale);
  const btn = document.getElementById("sizebtn");
  if (!btn) return;
  btn.textContent = "Size " + t.name;
  btn.setAttribute("aria-label", "Text size " + t.name + ", tap to change");
}

function cycleSize() {
  S.flags.tsize = (sizeIndex() + 1) % TSIZES.length;
  save();
  applySize();
  buzz(4);
}

/* ================= TAP / SWIPE ================= */
(function () {
  const zone = document.getElementById("reader");
  let x0 = 0, y0 = 0, moved = false;

  zone.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, { passive: true });

  zone.addEventListener("touchmove", e => {
    if (Math.abs(e.touches[0].clientX - x0) > 10 || Math.abs(e.touches[0].clientY - y0) > 10) moved = true;
  }, { passive: true });

  zone.addEventListener("touchend", e => {
    if (!readerOn || panelOpen) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 64 && Math.abs(dy) < 48) {
      if (current.book.mode === "sequential") step(dx < 0 ? 1 : -1);
      else shuffle();
    }
  }, { passive: true });

  /* the page itself is the button — except where a real control lives */
  zone.addEventListener("click", e => {
    if (!readerOn || panelOpen) return;
    if (e.target.closest("button")) return;
    if (String(window.getSelection())) return;     /* leave text selection alone */
    if (moved) { moved = false; return; }          /* that was a scroll or a swipe */
    advance();
  });
})();

/* ================= PANEL ================= */
function openPanel(kind) {
  buildPanel(kind);
  history.pushState({ v: "panel" }, "");
  panelOpen = true;
  document.getElementById("panel").classList.add("open");
}
function hidePanel() {
  if (!panelOpen) return;
  panelOpen = false;
  document.getElementById("panel").classList.remove("open");
}

function buildPanel(kind) {
  const body = document.getElementById("panel-body");
  document.getElementById("panel-title").textContent = kind === "contents" ? "Contents" : "Saved";

  if (kind === "contents") {
    const b = current.book;
    /* group by section so a book whose sections interleave still reads cleanly */
    const groups = [];
    b.concepts.forEach((c, i) => {
      const key = c.section || "";
      let g = groups.find(g => g.key === key);
      if (!g) groups.push(g = { key, items: [] });
      g.items.push({ c, i });
    });
    body.innerHTML = groups.map(g => `
      ${g.key ? `<div class="mono sect">${esc(g.key)}</div>` : ""}
      ${g.items.map(({ c, i }) => {
        const isRead = !!readSet(b)[c.id], isSaved = !!savedSet(b)[c.id];
        return `<button class="toc${isRead ? " done" : ""}${isSaved ? " mark" : ""}" onclick="jumpTo(${i})">
          <span class="num">${isSaved ? "◆" : isRead ? "■" : pad2(i + 1)}</span>
          <span class="t">${esc(c.title)}</span>
        </button>`;
      }).join("")}`).join("");
  } else {
    let html = "";
    window.__BOOKS.forEach(b => {
      b.concepts.forEach((c, i) => {
        if (!savedSet(b)[c.id]) return;
        html += `<button class="toc mark" onclick="openSaved('${b.id}',${i})">
          <span class="num">◆</span>
          <span class="t">${esc(c.title)}</span>
          <span class="from">${esc(b.title)}</span>
        </button>`;
      });
    });
    body.innerHTML = html || '<p class="blank">Nothing saved yet. Tag an idea in the reader and it lands here.</p>';
  }
  body.scrollTop = 0;
}

function jumpTo(i) {
  if (!current.book) return;
  const wasPanel = panelOpen;
  current.index = i;
  if (current.book.mode === "sequential") { S.pos[current.book.id] = i; save(); }
  current.layer = 1;
  render();
  window.scrollTo(0, 0);
  if (wasPanel) history.back();
}

function openSaved(bookId, i) {
  current.book = bookById(bookId);
  current.index = i;
  current.layer = 1;
  hidePanel();
  history.replaceState({ v: "reader" }, "");
  enterReader();
}

/* ================= COMPLETE ================= */
function showComplete(b) {
  document.getElementById("complete-top").textContent = b.mode === "sequential" ? "Sequence finished" : "Every idea unfolded";
  document.getElementById("complete-book").textContent = b.title;
  document.getElementById("complete-meter").innerHTML = meterHTML(b, {});
  const el = document.getElementById("complete");
  el.classList.remove("active"); void el.offsetWidth; el.classList.add("active");
  buzz([10, 55, 10]);
}
function closeComplete() { document.getElementById("complete").classList.remove("active"); }

/* ================= HISTORY / KEYS ================= */
window.addEventListener("popstate", () => {
  if (panelOpen) { hidePanel(); return; }
  if (readerOn) exitReader();
});

document.addEventListener("keydown", e => {
  if (!readerOn || panelOpen) return;
  if (e.key === "ArrowRight") { current.book.mode === "sequential" ? step(1) : shuffle(); }
  else if (e.key === "ArrowLeft" && current.book.mode === "sequential") step(-1);
  else if ((e.key === "Enter" || e.key === " ") && document.activeElement === document.body) { e.preventDefault(); advance(); }
});

/* ================= BOOT ================= */
applySize();
loadBooks();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
