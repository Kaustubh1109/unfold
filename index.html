<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Unfold</title>
<meta name="description" content="Books, one idea at a time. Read in layers.">
<meta name="theme-color" content="#F6F3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unfold">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --paper: #F6F3EA;
    --paper-deep: #EFEBDD;
    --ink: #2A251D;
    --ink-soft: #57503F;
    --ink-faint: #8C8371;
    --hairline: #E2DCCB;
    --seal: #9E3B26;
    --col: 40rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-serif, "New York", Charter, Georgia, serif;
    font-size: 1.09rem;
    line-height: 1.68;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .label {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 0.67rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }
  button {
    font: inherit; color: inherit; background: none; border: none; cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--ink-soft); outline-offset: 3px; border-radius: 2px; }

  .screen { display: none; max-width: var(--col); margin: 0 auto; padding: 1.4rem 1.5rem calc(6rem + env(safe-area-inset-bottom)); }
  .screen.active { display: block; }

  /* ---------- Library ---------- */
  .masthead { display: flex; align-items: baseline; justify-content: space-between; padding: 1.2rem 0 0.4rem; }
  .wordmark { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark span { color: var(--ink-faint); font-weight: 400; font-style: italic; }
  .saved-btn { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); padding: 0.4rem 0; }
  .saved-btn .seal-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--seal); margin-right: 0.4rem; vertical-align: 0.02rem; }
  .tagline { color: var(--ink-faint); font-style: italic; font-size: 0.95rem; margin-bottom: 2.4rem; }

  .book-row { display: block; width: 100%; text-align: left; padding: 1.5rem 0 1.4rem; border-bottom: 1px solid var(--hairline); }
  .book-row:first-of-type { border-top: 1px solid var(--hairline); }
  .book-row .label { display: flex; justify-content: space-between; margin-bottom: 0.45rem; }
  .book-title { font-size: 1.32rem; line-height: 1.3; font-weight: 600; margin-bottom: 0.2rem; }
  .book-author { color: var(--ink-soft); font-size: 0.95rem; font-style: italic; margin-bottom: 0.9rem; }
  .progress-track { height: 1px; background: var(--hairline); position: relative; }
  .progress-fill { position: absolute; left: 0; top: -0.5px; height: 2px; background: var(--ink); transition: width 0.6s ease; }
  .book-meta { display: flex; justify-content: space-between; margin-top: 0.55rem; }
  .book-meta .label { margin: 0; }

  .foot-note { margin-top: 2.6rem; text-align: center; }
  .foot-note .label { letter-spacing: 0.18em; }

  /* ---------- Reader ---------- */
  .reader-top { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0 2rem; }
  .back-btn, .contents-btn { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); padding: 0.5rem 0; }
  .reader-book { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; flex: 1; padding: 0 0.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .concept { animation: settle 0.5s ease both; }
  @keyframes settle { from { opacity: 0; transform: translateY(0.6rem); } to { opacity: 1; transform: none; } }

  .concept .eyebrow { margin-bottom: 0.9rem; }
  .concept-title { font-size: 1.85rem; line-height: 1.22; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 1.6rem; text-wrap: balance; }
  .hook { font-size: 1.28rem; line-height: 1.55; color: var(--ink); font-style: italic; }

  .layer { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.7s ease, opacity 0.55s ease 0.1s; }
  .layer.open { max-height: 400rem; opacity: 1; }
  .layer-rule { display: flex; align-items: center; gap: 0.8rem; margin: 2rem 0 1.6rem; }
  .layer-rule::before, .layer-rule::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .layer p { margin-bottom: 1.1rem; }
  .layer p:last-child { margin-bottom: 0; }

  .unfold-btn { display: block; margin: 2.2rem auto 0; padding: 0.85rem 1.8rem; border: 1px solid var(--ink-soft); border-radius: 99px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.75rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink); transition: opacity 0.3s; }
  .unfold-btn.hidden { display: none; }

  .source-line { margin-top: 2rem; }

  .end-mark { text-align: center; margin-top: 2.6rem; color: var(--ink-faint); font-size: 1.1rem; letter-spacing: 0.5em; }

  /* ---------- Bottom bar ---------- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--paper) 62%, rgba(246,243,234,0));
    padding: 1.6rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
    display: none;
  }
  .bar.active { display: block; }
  .bar-inner { max-width: var(--col); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .nav-btn { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); padding: 0.8rem 0.4rem; min-width: 4.2rem; }
  .nav-btn:disabled { color: var(--hairline); }
  .nav-btn.left { text-align: left; } .nav-btn.right { text-align: right; }

  .enso-btn { width: 3.7rem; height: 3.7rem; display: grid; place-items: center; }
  .enso-btn svg { width: 100%; height: 100%; overflow: visible; }
  .enso-stroke {
    fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round;
    stroke-dasharray: 300; stroke-dashoffset: 22;
    transform-origin: 50% 50%;
  }
  .enso-btn.spin .enso-stroke { animation: redraw 0.8s ease; }
  @keyframes redraw { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 22; } }

  .seal-btn { width: 2.9rem; height: 2.9rem; display: grid; place-items: center; border: 1px solid var(--hairline); border-radius: 6px; transition: all 0.25s; }
  .seal-btn .glyph { font-size: 1.05rem; color: var(--ink-faint); transition: all 0.25s; }
  .seal-btn.stamped { background: var(--seal); border-color: var(--seal); transform: rotate(-4deg); }
  .seal-btn.stamped .glyph { color: var(--paper); }

  /* ---------- Overlay (contents / saved) ---------- */
  .overlay { position: fixed; inset: 0; background: var(--paper); z-index: 20; display: none; overflow-y: auto; padding: 1.4rem 1.5rem calc(2rem + env(safe-area-inset-bottom)); }
  .overlay.active { display: block; }
  .overlay-inner { max-width: var(--col); margin: 0 auto; }
  .overlay-top { display: flex; justify-content: space-between; align-items: baseline; padding: 0.6rem 0 1.8rem; }
  .overlay-title { font-size: 1.3rem; font-weight: 600; }
  .toc-section { margin: 1.6rem 0 0.5rem; }
  .toc-row { display: flex; align-items: baseline; gap: 0.8rem; width: 100%; text-align: left; padding: 0.8rem 0; border-bottom: 1px solid var(--hairline); }
  .toc-mark { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.8rem; width: 1.2rem; flex-shrink: 0; color: var(--ink-faint); }
  .toc-mark.read { color: var(--ink); }
  .toc-mark.saved { color: var(--seal); }
  .toc-row .t { flex: 1; font-size: 1.02rem; line-height: 1.4; }
  .toc-row .b { font-size: 0.8rem; color: var(--ink-faint); font-style: italic; flex-shrink: 0; }
  .empty-note { color: var(--ink-faint); font-style: italic; padding: 2rem 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ============ LIBRARY ============ -->
<main id="library" class="screen active">
  <div class="masthead">
    <h1 class="wordmark">Unfold<span>.</span></h1>
    <button class="saved-btn" onclick="openSaved()"><span class="seal-dot"></span><span id="saved-count">Saved</span></button>
  </div>
  <p class="tagline">Books, one idea at a time.</p>
  <div id="book-list"></div>
  <div class="foot-note"><span class="label">To add a book, read the README</span></div>
</main>

<!-- ============ READER ============ -->
<main id="reader" class="screen">
  <div class="reader-top">
    <button class="back-btn" onclick="showLibrary()">&larr; Library</button>
    <div class="reader-book" id="reader-book-title"></div>
    <button class="contents-btn" onclick="openContents()">Contents</button>
  </div>
  <article class="concept" id="concept"></article>
</main>

<!-- ============ BOTTOM BAR ============ -->
<nav class="bar" id="bar">
  <div class="bar-inner" id="bar-inner"></div>
</nav>

<!-- ============ OVERLAY ============ -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="overlay-top">
      <div class="overlay-title" id="overlay-title"></div>
      <button class="back-btn" onclick="closeOverlay()">Close</button>
    </div>
    <div id="overlay-body"></div>
  </div>
</div>

<script>
/* ================= STATE ================= */
window.__BOOKS = [];
window.registerBook = function (book) { window.__BOOKS.push(book); };

const STORE_KEY = "unfold-state-v1";
let S = { read: {}, saved: {}, pos: {} };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); } catch (e) {}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let current = { book: null, index: 0, layer: 1 };

/* ================= BOOK LOADING ================= */
function loadBooks() {
  const files = window.BOOK_FILES || [];
  let remaining = files.length;
  if (!remaining) { renderLibrary(); return; }
  files.forEach(f => {
    const s = document.createElement("script");
    s.src = "books/" + f;
    s.onload = s.onerror = () => { if (--remaining === 0) renderLibrary(); };
    document.body.appendChild(s);
  });
}

/* ================= HELPERS ================= */
function bookById(id) { return window.__BOOKS.find(b => b.id === id); }
function readSet(b) { return S.read[b.id] || (S.read[b.id] = {}); }
function savedSet(b) { return S.saved[b.id] || (S.saved[b.id] = {}); }
function readCount(b) { return b.concepts.filter(c => readSet(b)[c.id]).length; }
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function paras(t) { return t.split(/\n\n+/).map(p => "<p>" + esc(p) + "</p>").join(""); }

/* ================= LIBRARY ================= */
function renderLibrary() {
  const list = document.getElementById("book-list");
  if (!window.__BOOKS.length) {
    list.innerHTML = '<p class="empty-note">No books loaded. Check books/manifest.js — the README explains everything.</p>';
    return;
  }
  list.innerHTML = window.__BOOKS.map(b => {
    const done = readCount(b), total = b.concepts.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const modeGlyph = b.mode === "sequential" ? "In order &rarr;" : "Shuffle &infin;";
    return `
      <button class="book-row" onclick="openBook('${b.id}')">
        <div class="label"><span>${modeGlyph}</span><span>${done} / ${total} read</span></div>
        <div class="book-title">${esc(b.title)}</div>
        <div class="book-author">${esc(b.author)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </button>`;
  }).join("");
  const totalSaved = window.__BOOKS.reduce((n, b) => n + Object.keys(S.saved[b.id] || {}).length, 0);
  document.getElementById("saved-count").textContent = totalSaved ? `Saved · ${totalSaved}` : "Saved";
}

function showLibrary() {
  document.getElementById("reader").classList.remove("active");
  document.getElementById("bar").classList.remove("active");
  document.getElementById("library").classList.add("active");
  renderLibrary();
  window.scrollTo(0, 0);
}

/* ================= READER ================= */
function openBook(id) {
  const b = bookById(id);
  if (!b) return;
  current.book = b;
  if (b.mode === "sequential") {
    current.index = Math.min(S.pos[b.id] || 0, b.concepts.length - 1);
  } else {
    current.index = pickShuffleIndex(b, true);
  }
  showReader();
}

function pickShuffleIndex(b, allowCurrentFirstLoad) {
  const unread = b.concepts.map((c, i) => readSet(b)[c.id] ? -1 : i).filter(i => i >= 0);
  const pool = unread.length ? unread : b.concepts.map((_, i) => i);
  let pick = pool[Math.floor(Math.random() * pool.length)];
  if (pool.length > 1 && !allowCurrentFirstLoad) {
    while (pick === current.index) pick = pool[Math.floor(Math.random() * pool.length)];
  }
  return pick;
}

function showReader() {
  document.getElementById("library").classList.remove("active");
  document.getElementById("reader").classList.add("active");
  document.getElementById("bar").classList.add("active");
  current.layer = 1;
  renderConcept();
  renderBar();
  window.scrollTo(0, 0);
}

function renderConcept() {
  const b = current.book, c = b.concepts[current.index];
  document.getElementById("reader-book-title").textContent = b.title;
  const el = document.getElementById("concept");
  el.innerHTML = `
    <div class="label eyebrow">${esc(c.section || "")}</div>
    <h2 class="concept-title">${esc(c.title)}</h2>
    <p class="hook">${esc(c.hook)}</p>

    <div class="layer" id="layer-idea">
      <div class="layer-rule"><span class="label">The idea</span></div>
      ${paras(c.idea)}
    </div>

    <div class="layer" id="layer-deep">
      <div class="layer-rule"><span class="label">Going deeper</span></div>
      ${paras(c.deep)}
      ${c.source ? `<div class="source-line label">${esc(c.source)}</div>` : ""}
      <div class="end-mark">&#8226;&#8226;&#8226;</div>
    </div>

    <button class="unfold-btn" id="unfold" onclick="unfold()">Unfold the idea</button>
  `;
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "";
  updateSealBtn();
}

function unfold() {
  const btn = document.getElementById("unfold");
  if (current.layer === 1) {
    document.getElementById("layer-idea").classList.add("open");
    btn.textContent = "Go deeper";
    current.layer = 2;
    markRead();
  } else if (current.layer === 2) {
    document.getElementById("layer-deep").classList.add("open");
    btn.classList.add("hidden");
    current.layer = 3;
  }
}

function markRead() {
  const b = current.book, c = b.concepts[current.index];
  if (!readSet(b)[c.id]) { readSet(b)[c.id] = true; save(); renderBar(); }
}

/* ================= BOTTOM BAR ================= */
function renderBar() {
  const b = current.book;
  if (!b) return;
  const inner = document.getElementById("bar-inner");
  const done = readCount(b), total = b.concepts.length;
  if (b.mode === "sequential") {
    inner.innerHTML = `
      <button class="nav-btn left" id="prev-btn" onclick="step(-1)">&larr; Prev</button>
      <div style="text-align:center">
        <div class="label" style="margin-bottom:0.5rem">${current.index + 1} of ${total}</div>
        <button class="seal-btn" id="seal" onclick="toggleSaved()" aria-label="Save this idea"><span class="glyph">&#10047;</span></button>
      </div>
      <button class="nav-btn right" id="next-btn" onclick="step(1)">Next &rarr;</button>`;
    document.getElementById("prev-btn").disabled = current.index === 0;
    document.getElementById("next-btn").disabled = current.index === total - 1;
  } else {
    inner.innerHTML = `
      <div class="label" style="min-width:4.2rem">${done} / ${total}<br>read</div>
      <button class="enso-btn" id="enso" onclick="shuffle()" aria-label="Shuffle to a new idea">
        <svg viewBox="0 0 100 100"><circle class="enso-stroke" cx="50" cy="50" r="42" transform="rotate(-64 50 50)"/></svg>
      </button>
      <div style="min-width:4.2rem;display:flex;justify-content:flex-end">
        <button class="seal-btn" id="seal" onclick="toggleSaved()" aria-label="Save this idea"><span class="glyph">&#10047;</span></button>
      </div>`;
  }
  updateSealBtn();
}

function updateSealBtn() {
  const sealBtn = document.getElementById("seal");
  if (!sealBtn || !current.book) return;
  const c = current.book.concepts[current.index];
  sealBtn.classList.toggle("stamped", !!savedSet(current.book)[c.id]);
}

function step(dir) {
  const b = current.book;
  const next = current.index + dir;
  if (next < 0 || next >= b.concepts.length) return;
  current.index = next;
  S.pos[b.id] = next; save();
  current.layer = 1;
  renderConcept(); renderBar();
  window.scrollTo(0, 0);
}

function shuffle() {
  const enso = document.getElementById("enso");
  enso.classList.remove("spin"); void enso.offsetWidth; enso.classList.add("spin");
  current.index = pickShuffleIndex(current.book, false);
  current.layer = 1;
  renderConcept(); renderBar();
  window.scrollTo(0, 0);
}

function toggleSaved() {
  const b = current.book, c = b.concepts[current.index];
  if (savedSet(b)[c.id]) delete savedSet(b)[c.id];
  else savedSet(b)[c.id] = true;
  save();
  updateSealBtn();
}

/* ================= OVERLAYS ================= */
function openContents() {
  const b = current.book;
  document.getElementById("overlay-title").textContent = "Contents";
  let html = "", lastSection = null;
  b.concepts.forEach((c, i) => {
    if (c.section && c.section !== lastSection) {
      html += `<div class="label toc-section">${esc(c.section)}</div>`;
      lastSection = c.section;
    }
    const isRead = !!readSet(b)[c.id], isSaved = !!savedSet(b)[c.id];
    const mark = isSaved ? '<span class="toc-mark saved">&#10047;</span>'
               : isRead ? '<span class="toc-mark read">&#10003;</span>'
               : '<span class="toc-mark">&#9675;</span>';
    html += `<button class="toc-row" onclick="jumpTo(${i})">${mark}<span class="t">${esc(c.title)}</span></button>`;
  });
  document.getElementById("overlay-body").innerHTML = html;
  document.getElementById("overlay").classList.add("active");
}

function jumpTo(i) {
  current.index = i;
  if (current.book.mode === "sequential") { S.pos[current.book.id] = i; save(); }
  current.layer = 1;
  closeOverlay();
  renderConcept(); renderBar();
  window.scrollTo(0, 0);
}

function openSaved() {
  document.getElementById("overlay-title").textContent = "Saved ideas";
  let html = "";
  window.__BOOKS.forEach(b => {
    b.concepts.forEach((c, i) => {
      if (savedSet(b)[c.id]) {
        html += `<button class="toc-row" onclick="openSavedConcept('${b.id}',${i})">
          <span class="toc-mark saved">&#10047;</span>
          <span class="t">${esc(c.title)}</span>
          <span class="b">${esc(b.title.length > 22 ? b.title.slice(0, 22) + "…" : b.title)}</span>
        </button>`;
      }
    });
  });
  document.getElementById("overlay-body").innerHTML = html || '<p class="empty-note">Nothing saved yet. Stamp the seal on ideas worth returning to.</p>';
  document.getElementById("overlay").classList.add("active");
}

function openSavedConcept(bookId, i) {
  current.book = bookById(bookId);
  current.index = i;
  closeOverlay();
  showReader();
}

function closeOverlay() {
  document.getElementById("overlay").classList.remove("active");
}

/* ================= BOOT ================= */
loadBooks();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
